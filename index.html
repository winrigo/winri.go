<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>winri.go — GO Tracker</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <header class="site-header">
  <div class="brand">
    <div class="logo">WINRI.GO ♡</div>
    <div class="subtitle">YOUR GO, MADE SIMPLE.</div>
  </div>

  <nav class="nav">
    <a href="#home">HOME</a>
    <a href="#tracker">TRACK</a>
    <a href="#updates">UPDATES</a>
    <a href="#terms">T&C</a>
  </nav>
</header>

 <main id="home">

  <section class="search-box" id="tracker">

        <h1>Track your order ♡</h1>

        <p>
          Enter your Telegram username to check your GO orders.
        </p>

        <div class="search-area">
          <input
            type="text"
            id="usernameInput"
            placeholder="@username"
            autocomplete="off"
          >

          <button onclick="searchOrders()">
            Search
          </button>
        </div>

        <div id="message"></div>

      </section>


      <section id="results" class="results hidden">

        <div class="results-header">
          <h2>Your Orders</h2>
          <span id="usernameDisplay"></span>
        </div>

        <div id="orderList"></div>

      </section>

    </main>


    <footer>
      <p>winri.go ♡ K-pop GO tracker</p>
    </footer>

  </div>

<script src="scripts.js"></script>
  
</body>
</html>
