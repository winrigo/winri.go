<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>winri.go — GO Tracker</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <header>
      <div class="logo">winri.go</div>
      <div class="subtitle">GO TRACKER</div>
    </header>

    <main>

      <section class="search-box">

        <h1>Track your order ♡</h1>

        <p>
          Enter your Telegram username to check your GO orders.
        </p>

        <div class="search-area">
          <input
            type="text"
            id="usernameInput"
            placeholder="@username"
            autocomplete="off"
          >

          <button onclick="searchOrders()">
            Search
          </button>
        </div>

        <div id="message"></div>

      </section>


      <section id="results" class="results hidden">

        <div class="results-header">
          <h2>Your Orders</h2>
          <span id="usernameDisplay"></span>
        </div>

        <div id="orderList"></div>

      </section>

    </main>


    <footer>
      <p>winri.go ♡ K-pop GO tracker</p>
    </footer>

  </div>

  <script src="script.js"></script>

</body>
</html>
